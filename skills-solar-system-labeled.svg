<svg viewBox="0 0 950 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="sun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="60%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="950" height="650" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="120" cy="80" r="1" opacity="0.6"/>
    <circle cx="220" cy="20" r="1.4" opacity="0.9"/>
    <circle cx="330" cy="60" r="1" opacity="0.5"/>
    <circle cx="480" cy="15" r="1.3" opacity="0.7"/>
    <circle cx="600" cy="40" r="1" opacity="0.6"/>
    <circle cx="700" cy="70" r="1.2" opacity="0.8"/>
    <circle cx="800" cy="30" r="1" opacity="0.6"/>
    <circle cx="880" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="60" cy="600" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="620" r="1" opacity="0.6"/>
    <circle cx="300" cy="590" r="1.3" opacity="0.8"/>
    <circle cx="420" cy="625" r="1" opacity="0.5"/>
    <circle cx="540" cy="605" r="1.2" opacity="0.7"/>
    <circle cx="680" cy="595" r="1" opacity="0.6"/>
    <circle cx="820" cy="620" r="1.3" opacity="0.8"/>
    <circle cx="880" cy="580" r="1" opacity="0.6"/>
  </g>

  <text x="475" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Verdana, sans-serif" font-size="18" letter-spacing="2">
    ARJUN DEV TRIPATHI
  </text>
  <text x="475" y="56" text-anchor="middle" fill="#94a3b8" font-family="Verdana, sans-serif" font-size="11" letter-spacing="1">
    Data Scientist — ML · GenAI · Agentic AI
  </text>

  <!-- orbit paths -->
  <g fill="none" stroke="#3a4a5a" stroke-width="1" opacity="0.5">
    <ellipse cx="475" cy="340" rx="60" ry="24"/>
    <ellipse cx="475" cy="340" rx="105" ry="42"/>
    <ellipse cx="475" cy="340" rx="155" ry="62"/>
    <ellipse cx="475" cy="340" rx="210" ry="84"/>
    <ellipse cx="475" cy="340" rx="270" ry="108"/>
  </g>

  <!-- sun: 4+ years experience -->
  <circle cx="475" cy="340" r="26" fill="url(#sun)">
    <animate attributeName="r" values="26;28;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="475" y="345" text-anchor="middle" fill="#3b2a00" font-family="Verdana, sans-serif" font-size="9" font-weight="bold">4+ YRS</text>

  <!-- orbit 1: Python, LangChain -->
  <g>
    <g>
      <circle r="7" fill="#4da6ff"/>
      <text x="0" y="-12" text-anchor="middle" fill="#7dd3fc" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">Python</text>
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M 475,340 m -60,0 a 60,24 0 1,0 120,0 a 60,24 0 1,0 -120,0"/>
    </g>
  </g>
  <g>
    <g>
      <circle r="6" fill="#7dd3fc"/>
      <text x="0" y="-12" text-anchor="middle" fill="#bae6fd" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">LangChain</text>
      <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"
        path="M 475,340 m -60,0 a 60,24 0 1,0 120,0 a 60,24 0 1,0 -120,0"/>
    </g>
  </g>

  <!-- orbit 2: LangGraph, FastAPI -->
  <g>
    <g>
      <circle r="7" fill="#22c55e"/>
      <text x="0" y="-12" text-anchor="middle" fill="#86efac" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">LangGraph</text>
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 475,340 m -105,0 a 105,42 0 1,0 210,0 a 105,42 0 1,0 -210,0"/>
    </g>
  </g>
  <g>
    <g>
      <circle r="6" fill="#86efac"/>
      <text x="0" y="-12" text-anchor="middle" fill="#bbf7d0" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">FastAPI</text>
      <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite"
        path="M 475,340 m -105,0 a 105,42 0 1,0 210,0 a 105,42 0 1,0 -210,0"/>
    </g>
  </g>

  <!-- orbit 3: Streamlit, RAG Systems -->
  <g>
    <g>
      <circle r="7" fill="#f97316"/>
      <text x="0" y="-12" text-anchor="middle" fill="#fdba74" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">Streamlit</text>
      <animateMotion dur="12s" repeatCount="indefinite"
        path="M 475,340 m -155,0 a 155,62 0 1,0 310,0 a 155,62 0 1,0 -310,0"/>
    </g>
  </g>
  <g>
    <g>
      <circle r="6" fill="#fdba74"/>
      <text x="0" y="-12" text-anchor="middle" fill="#fed7aa" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">RAG Systems</text>
      <animateMotion dur="12s" begin="-6s" repeatCount="indefinite"
        path="M 475,340 m -155,0 a 155,62 0 1,0 310,0 a 155,62 0 1,0 -310,0"/>
    </g>
  </g>

  <!-- orbit 4: Prompt Engineering, TensorFlow -->
  <g>
    <g>
      <circle r="7" fill="#a855f7"/>
      <text x="0" y="-12" text-anchor="middle" fill="#d8b4fe" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">Prompt Engineering</text>
      <animateMotion dur="16s" repeatCount="indefinite"
        path="M 475,340 m -210,0 a 210,84 0 1,0 420,0 a 210,84 0 1,0 -420,0"/>
    </g>
  </g>
  <g>
    <g>
      <circle r="6" fill="#d8b4fe"/>
      <text x="0" y="-12" text-anchor="middle" fill="#e9d5ff" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">TensorFlow</text>
      <animateMotion dur="16s" begin="-8s" repeatCount="indefinite"
        path="M 475,340 m -210,0 a 210,84 0 1,0 420,0 a 210,84 0 1,0 -420,0"/>
    </g>
  </g>

  <!-- orbit 5: PyTorch -->
  <g>
    <g>
      <circle r="7" fill="#ef4444"/>
      <text x="0" y="-12" text-anchor="middle" fill="#fca5a5" font-family="Verdana, sans-serif" font-size="10" font-weight="bold">PyTorch</text>
      <animateMotion dur="20s" repeatCount="indefinite"
        path="M 475,340 m -270,0 a 270,108 0 1,0 540,0 a 270,108 0 1,0 -540,0"/>
    </g>
  </g>
</svg>
