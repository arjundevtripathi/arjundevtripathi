<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arjun Dev Tripathi - Data Scientist</title>
</head>
<body>

<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Sun Gradient -->
    <radialGradient id="sun" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="50%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </radialGradient>
    
    <!-- Glow Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient for text -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#bg)"/>

  <!-- ============================================================ -->
  <!-- STARS - Animated Twinkling -->
  <!-- ============================================================ -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.5" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="80" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="20" r="1.8" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="60" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="15" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="40" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="70" r="1.5" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="30" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="90" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="50" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="650" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="670" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="640" r="1.8" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="675" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="655" r="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="645" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="670" r="1.8" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="630" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="680" r="1.2" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================================================ -->
  <!-- HEADER -->
  <!-- ============================================================ -->
  <text x="500" y="35" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="3" filter="url(#glow)">
    ARJUN DEV TRIPATHI
  </text>
  
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">
    DATA SCIENTIST  ·  ML ENGINEER  ·  GEN AI PRACTITIONER
  </text>
  
  <text x="500" y="78" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10" letter-spacing="1">
    4+ YEARS EXPERIENCE
  </text>

  <!-- ============================================================ -->
  <!-- ORBITS -->
  <!-- ============================================================ -->
  <g fill="none" stroke="#3a4a5a" stroke-width="1" opacity="0.4">
    <ellipse cx="500" cy="350" rx="70" ry="28"/>
    <ellipse cx="500" cy="350" rx="120" ry="48"/>
    <ellipse cx="500" cy="350" rx="175" ry="70"/>
    <ellipse cx="500" cy="350" rx="235" ry="94"/>
    <ellipse cx="500" cy="350" rx="300" ry="120"/>
    <ellipse cx="500" cy="350" rx="370" ry="148"/>
  </g>

  <!-- ============================================================ -->
  <!-- SUN / CENTER: ARJUN -->
  <!-- ============================================================ -->
  <circle cx="500" cy="350" r="32" fill="url(#sun)" filter="url(#softGlow)">
    <animate attributeName="r" values="32;36;32" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="347" text-anchor="middle" fill="#3b2a00" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ARJUN</text>
  <text x="500" y="360" text-anchor="middle" fill="#3b2a00" font-family="Arial, sans-serif" font-size="7">DEV</text>

  <!-- ============================================================ -->
  <!-- ORBIT 1: Python, LangChain (6s) -->
  <!-- ============================================================ -->
  <!-- Python -->
  <g>
    <g>
      <circle r="9" fill="#4da6ff" filter="url(#glow)"/>
      <text x="0" y="-14" text-anchor="middle" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Python</text>
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M 500,350 m -70,0 a 70,28 0 1,0 140,0 a 70,28 0 1,0 -140,0"/>
    </g>
  </g>
  <!-- LangChain -->
  <g>
    <g>
      <circle r="8" fill="#7dd3fc"/>
      <text x="0" y="-14" text-anchor="middle" fill="#bae6fd" font-family="Arial, sans-serif" font-size="10" font-weight="bold">LangChain</text>
      <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"
        path="M 500,350 m -70,0 a 70,28 0 1,0 140,0 a 70,28 0 1,0 -140,0"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ORBIT 2: LangGraph, FastAPI (9s) -->
  <!-- ============================================================ -->
  <!-- LangGraph -->
  <g>
