  </text>

  <!-- ============================================================ -->
  <!-- CODE.LEARN.INNOVATE. -->
  <!-- ============================================================ -->
  <text x="500" y="712" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="3">
