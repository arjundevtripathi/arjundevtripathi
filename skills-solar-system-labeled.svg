    <text x="610" y="605" text-anchor="middle" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🛠️ TOOLS</text>
    <text x="610" y="625" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Python · SQL</text>
    <text x="610" y="642" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Git · Docker</text>
    <text x="610" y="659" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">LangChain · LangGraph</text>

    <!-- Goal -->
    <rect x="740" y="580" width="200" height="95" rx="10" fill="rgba(15,32,39,0.8)" stroke="#4a5a6a" stroke-width="1"/>
    <text x="840" y="605" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🚀 GOAL</text>
    <text x="840" y="625" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Building Impactful</text>
    <text x="840" y="642" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">AI Driven Products</text>
    <text x="840" y="659" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Innovative Solutions</text>
