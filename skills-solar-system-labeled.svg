    <ellipse cx="500" cy="370" rx="120" ry="48"/>
    <ellipse cx="500" cy="370" rx="175" ry="70"/>
    <ellipse cx="500" cy="370" rx="235" ry="94"/>
    <ellipse cx="500" cy="370" rx="300" ry="120"/>
