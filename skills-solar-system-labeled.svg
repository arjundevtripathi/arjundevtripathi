      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 500,350 m -120,0 a 120,48 0 1,0 240,0 a 120,48 0 1,0 -240,0"/>
    </g>
  </g>
  <!-- FastAPI -->
  <g>
    <g>
      <circle r="8" fill="#86efac"/>
      <text x="0" y="-14" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="10" font-weight="bold">FastAPI</text>
      <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite"
        path="M 500,350 m -120,0 a 120,48 0 1,0 240,0 a 120,48 0 1,0 -240,0"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ORBIT 3: Streamlit, RAG Systems (12s) -->
  <!-- ============================================================ -->
  <!-- Streamlit -->
  <g>
    <g>
      <circle r="9" fill="#f97316" filter="url(#glow)"/>
      <text x="0" y="-14" text-anchor="middle" fill="#fdba74" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Streamlit</text>
      <animateMotion dur="12s" repeatCount="indefinite"
        path="M 500,350 m -175,0 a 175,70 0 1,0 350,0 a 175,70 0 1,0 -350,0"/>
    </g>
  </g>
  <!-- RAG Systems -->
  <g>
    <g>
      <circle r="8" fill="#fdba74"/>
      <text x="0" y="-14" text-anchor="middle" fill="#fed7aa" font-family="Arial, sans-serif" font-size="10" font-weight="bold">RAG Systems</text>
      <animateMotion dur="12s" begin="-6s" repeatCount="indefinite"
        path="M 500,350 m -175,0 a 175,70 0 1,0 350,0 a 175,70 0 1,0 -350,0"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ORBIT 4: Prompt Engineering, TensorFlow (16s) -->
  <!-- ============================================================ -->
  <!-- Prompt Engineering -->
  <g>
    <g>
      <circle r="9" fill="#a855f7" filter="url(#glow)"/>
      <text x="0" y="-14" text-anchor="middle" fill="#d8b4fe" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Prompt Engineering</text>
      <animateMotion dur="16s" repeatCount="indefinite"
        path="M 500,350 m -235,0 a 235,94 0 1,0 470,0 a 235,94 0 1,0 -470,0"/>
    </g>
  </g>
  <!-- TensorFlow -->
  <g>
    <g>
      <circle r="8" fill="#d8b4fe"/>
      <text x="0" y="-14" text-anchor="middle" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">TensorFlow</text>
      <animateMotion dur="16s" begin="-8s" repeatCount="indefinite"
        path="M 500,350 m -235,0 a 235,94 0 1,0 470,0 a 235,94 0 1,0 -470,0"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ORBIT 5: PyTorch, Docker (20s) -->
  <!-- ============================================================ -->
  <!-- PyTorch -->
  <g>
    <g>
      <circle r="9" fill="#ef4444" filter="url(#glow)"/>
      <text x="0" y="-14" text-anchor="middle" fill="#fca5a5" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PyTorch</text>
      <animateMotion dur="20s" repeatCount="indefinite"
        path="M 500,350 m -300,0 a 300,120 0 1,0 600,0 a 300,120 0 1,0 -600,0"/>
    </g>
  </g>
  <!-- Docker -->
  <g>
    <g>
      <circle r="8" fill="#fca5a5"/>
      <text x="0" y="-14" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Docker</text>
      <animateMotion dur="20s" begin="-10s" repeatCount="indefinite"
        path="M 500,350 m -300,0 a 300,120 0 1,0 600,0 a 300,120 0 1,0 -600,0"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ORBIT 6: Git, SQL (24s) -->
  <!-- ============================================================ -->
  <!-- Git -->
  <g>
    <g>
      <circle r="9" fill="#f59e0b" filter="url(#glow)"/>
      <text x="0" y="-14" text-anchor="middle" fill="#fcd34d" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Git</text>
      <animateMotion dur="24s" repeatCount="indefinite"
        path="M 500,350 m -370,0 a 370,148 0 1,0 740,0 a 370,148 0 1,0 -740,0"/>
    </g>
  </g>
  <!-- SQL -->
  <g>
    <g>
      <circle r="8" fill="#fcd34d"/>
      <text x="0" y="-14" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SQL</text>
      <animateMotion dur="24s" begin="-12s" repeatCount="indefinite"
        path="M 500,350 m -370,0 a 370,148 0 1,0 740,0 a 370,148 0 1,0 -740,0"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- BOTTOM INFO BOXES -->
  <!-- ============================================================ -->
  
  <!-- Bottom Info Bar -->
  <g>
    <!-- Focus -->
    <rect x="50" y="580" width="200" height="95" rx="10" fill="rgba(15,32,39,0.8)" stroke="#4a5a6a" stroke-width="1"/>
    <text x="150" y="605" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🎯 FOCUS</text>
    <text x="150" y="625" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">AI Solutions</text>
    <text x="150" y="642" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Data Driven Insights</text>
    <text x="150" y="659" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Generative AI</text>

    <!-- Expertise -->
    <rect x="280" y="580" width="200" height="95" rx="10" fill="rgba(15,32,39,0.8)" stroke="#4a5a6a" stroke-width="1"/>
    <text x="380" y="605" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">⚡ EXPERTISE</text>
    <text x="380" y="625" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">ML · DL · NLP</text>
    <text x="380" y="642" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">GenAI · LLM · RAG</text>
    <text x="380" y="659" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="9">Agentic AI</text>

    <!-- Tools -->
